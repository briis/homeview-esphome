#############################################################
#  HomeView desktop preview (ESPHome "host" platform + SDL window)
#  Renders the exact same theme/pages/widgets on your Mac/PC.
#    esphome run preview-host.yaml
#  Needs SDL2 (brew install sdl2). Demo data is injected on boot.
#############################################################
substitutions:
  device_name: homeview-cachetest
  location_name: "Roskilde"
  weather_entity: weather.demo
  weather_high_entity: sensor.demo_high
  weather_low_entity: sensor.demo_low
  event_entity: sensor.demo_event
  price_entity: sensor.demo_price
  price_level_entity: sensor.demo_price_level
  price_cheapest_entity: sensor.demo_price_cheapest
  face_value1_entity: sensor.demo_indoor
  face_value1_label: "BAD"
  face_value1_icon: "\U000F050F"
  face_value1_color: "0xFF9F0A"
  face_value1_decimals: "1"
  face_value1_unit: "°"
  face_value2_entity: sensor.demo_price
  face_value2_label: "FUGT"
  face_value2_icon: "\U000F058E"
  face_value2_color: "0x64D2FF"
  face_value2_decimals: "0"
  face_value2_unit: " %"
  home_title: "Hjem"
  chip_climate_entity: sensor.demo_chip1
  chip_lights_entity: sensor.demo_chip2
  chip_locks_entity: sensor.demo_chip3
  tile1_entity: light.demo1
  tile1_name: "Loftslys Stue"
  tile1_icon: "\U000F0769"
  tile1_color: "0xFFB300"
  tile1_action: light.toggle
  tile2_entity: light.demo2
  tile2_name: "Gulvlamper"
  tile2_icon: "\U000F08DD"
  tile2_color: "0xFFB300"
  tile2_action: light.toggle
  tile3_entity: light.demo3
  tile3_name: "Spisebord"
  tile3_icon: "\U000F0335"
  tile3_color: "0xFFB300"
  tile3_action: light.toggle
  tile4_entity: light.demo4
  tile4_name: "Køkkenvask"
  tile4_icon: "\U000F0335"
  tile4_color: "0xFFB300"
  tile4_action: light.toggle
  tile5_entity: light.demo5
  tile5_name: "Panelvæg"
  tile5_icon: "\U000F1051"
  tile5_color: "0xFFB300"
  tile5_action: light.toggle
  lock1_entity: lock.demo
  lock1_name: "Fordør"
  ha_url: "http://127.0.0.1:8123"
  room_title: "Badeværelse"
  room_media_entity: media_player.demo
  room_climate_entity: climate.demo
  room_light_entity: light.demo_bath
  room_light_name: "Loftslys"
  room_climate_text_entity: sensor.demo_bath_climate
  room_window_text_entity: sensor.demo_bath_window
  # Which screen to show 3 s after boot: face | home | night | radio
  preview_screen: home
  preview_stack_card: "0"

esphome:
  name: ${device_name}
  # Only needed where the PlatformIO registry is unreachable; harmless otherwise
  libraries:
    - "lvgl/lvgl=https://github.com/lvgl/lvgl.git#v9.5.0"
    - "bblanchon/ArduinoJson=https://github.com/bblanchon/ArduinoJson.git#v7.4.3"
    - "pngle=https://github.com/kikuchan/pngle.git#v1.1.0"
  on_boot:
    priority: -100
    then:
      - delay: 500ms
      - lambda: |-
          id(face_weather_cond_ha).publish_state("cloudy");
          id(face_weather_temp_ha).publish_state(7.0);
          id(face_weather_high_ha).publish_state(9);
          id(face_weather_low_ha).publish_state(4);
          id(face_event_title_ha).publish_state("Tandlæge");
          id(face_event_when_ha).publish_state("I DAG · 15:00");
          id(face_value1_ha).publish_state(23.5);
          id(face_value2_ha).publish_state(40);
          id(bath_chip_climate_ha).publish_state("23,5° · 40 % fugt");
          id(bath_chip_window_ha).publish_state("Vindue lukket");
          id(bath_media_state_ha).publish_state("playing");
          id(bath_media_title_ha).publish_state("P1 Morgen");
          id(bath_media_artist_ha).publish_state("");
          id(bath_media_channel_ha).publish_state("DR P1");
          id(bath_media_volume_ha).publish_state(0.33);
          id(bath_heat_target_ha).publish_state(24.0);
          id(bath_heat_current_ha).publish_state(23.5);
          id(bath_heat_action_ha).publish_state("heating");
          id(bath_heat_preset_ha).publish_state("constant_temperature");
          id(bath_light_ha).publish_state("on");
          for (auto *t : {id(st1_state_ha), id(st2_state_ha), id(st3_state_ha), id(st4_state_ha), id(st5_state_ha), id(st6_state_ha), id(st7_state_ha)}) t->publish_state("playing");
          for (auto *t : {id(st1_channel_ha), id(st2_channel_ha), id(st3_channel_ha), id(st4_channel_ha), id(st5_channel_ha), id(st6_channel_ha), id(st7_channel_ha)}) t->publish_state("DR P1");
      - delay: 1500ms
      - lambda: 'id(bath_media_channel_ha).publish_state("DR P2"); id(bath_media_picture_ha).publish_state("/p2.png?cache=1");'
      - delay: 3s
      - lambda: 'id(bath_media_channel_ha).publish_state("Some New Station"); id(bath_media_picture_ha).publish_state("/unknown.png?cache=2");'
      - delay: 3s
      - lambda: 'id(bath_media_channel_ha).publish_state("DR P4 København"); id(bath_media_picture_ha).publish_state("/p1.png?cache=3");'
      - delay: 2500ms
      - if:
          condition:
            lambda: 'return std::string("${preview_screen}") == "home";'
          then:
            - lvgl.page.show: home_page
      - if:
          condition:
            lambda: 'return std::string("${preview_screen}") == "radio";'
          then:
            - lvgl.page.show: radio_page
      - if:
          condition:
            lambda: 'return std::string("${preview_screen}") == "night";'
          then:
            - switch.turn_on: hv_sw_night

host:

logger:
  level: INFO

api:

time:
  - platform: host
    id: hv_time
    timezone: Europe/Copenhagen

display:
  - platform: sdl
    id: main_display
    dimensions:
      width: 800
      height: 480
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: sdl
    id: main_touch
    display: main_display

output:
  - platform: template
    id: backlight_output
    type: binary
    write_action:
      - logger.log: "backlight"

light:
  - platform: binary
    id: screen_backlight
    name: "Skærm"
    output: backlight_output
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: template
    id: hv_proximity
    name: "Nærhed"
    lambda: "return false;"

packages:
  layout: !include packages/hardware/layout-800x480.yaml
  theme: !include packages/core/theme.yaml
  presence: !include packages/core/presence.yaml
  face: !include packages/pages/face.yaml
  home: !include rooms/badevaerelse/home.yaml
  radio: !include rooms/badevaerelse/radio.yaml

# referenced by the top-layer banner in theme
script:
  - id: homeview_refresh_all
    then:
      - lvgl.widget.hide: hv_status_banner
