#############################################################
#  HomeView – hardware bring-up test (single file)
#  Flash this first to verify screen, touch, backlight and the
#  VL53L0X before installing the full modular HomeView config.
#############################################################
esphome:
  name: homeview
  friendly_name: HomeView

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none


esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      # Keeps the RGB panel from tearing/flickering while flash is busy (OTA, NVS writes)
      execute_from_psram: true
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y

psram:
  mode: octal
  speed: 80MHz

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

ch422g:
  - id: ch422g_hub
    i2c_id: bus_a

display:
  - platform: mipi_rgb
    id: main_display
    model: ESP32-S3-TOUCH-LCD-4.3
    update_interval: never
    auto_clear_enabled: false
    # Override the model's enable pin so the backlight can ALSO be driven by
    # the "Screen" light below (allow_other_uses).
    enable_pin:
      ch422g: ch422g_hub
      number: 2
      allow_other_uses: true

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    i2c_id: bus_a
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g_hub
      number: 1
    on_touch:
      - logger.log:
          format: "Touch x=%d y=%d"
          args: ['touch.x', 'touch.y']

output:
  - platform: gpio
    id: backlight_output
    pin:
      ch422g: ch422g_hub
      number: 2
      allow_other_uses: true

light:
  - platform: binary
    id: screen_backlight
    name: "Skærm"
    icon: mdi:monitor
    output: backlight_output
    restore_mode: ALWAYS_ON

sensor:
  - platform: vl53l0x
    id: hv_distance
    name: "Afstand"
    i2c_id: bus_a
    long_range: true
    update_interval: 500ms
    on_value:
      - lvgl.label.update:
          id: dist_lbl
          text: !lambda 'return std::isnan(x) ? std::string("Afstand: --") : str_sprintf("Afstand: %.0f cm", x * 100);'

lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  buffer_size: 25%
  bg_color: 0x000000
  widgets:
    - label:
        align: CENTER
        y: -40
        text: "HomeView bring-up"
        text_font: montserrat_40
        text_color: 0xFFFFFF
    - label:
        id: dist_lbl
        align: CENTER
        y: 20
        text: "Afstand: --"
        text_font: montserrat_28
        text_color: 0xFF9F0A
    - button:
        align: BOTTOM_MID
        y: -40
        width: 240
        height: 64
        radius: 22
        bg_color: 0x2C2C2E
        checkable: true
        checked:
          bg_color: 0xF2F2F7
        widgets:
          - label:
              align: CENTER
              text: "Tryk her"
              text_font: montserrat_24
