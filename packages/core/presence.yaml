#############################################################
#  PRESENCE / AMBIENT STATE MACHINE  (HomeView-style behaviour)
#
#  Contract:
#   - A proximity package (packages/sensors/proximity-*.yaml) provides
#     binary_sensor  id: hv_proximity   and calls
#     script homeview_proximity_changed  on every state change.
#   - Page packages provide LVGL pages  id: face_page  and  id: home_page.
#
#  Behaviour:
#   AMBIENT  nobody close         -> Face (analog clock + 4 complications)
#   NEAR     someone approaches   -> wakes screen, optionally opens Home
#   IDLE     no touch for N s and
#            nobody close         -> glides back to the Face
#   SLEEP    (optional) nobody close for N min -> backlight off
#   NIGHT    switch / HA automation -> red, StandBy-style tint
#   NIGHT-OFF (optional) between "Nat fra" and "Nat til" the screen is
#            dark. It wakes on proximity or only on touch ("Tænd skærm om
#            natten med"), stays on for "Tændt om natten i" seconds after
#            the last touch / presence, then goes dark again.
#            Alarms, doorbell and leak warnings still wake it.
#############################################################

globals:
  - id: hv_last_activity
    type: uint32_t
    restore_value: false
    initial_value: "0"

switch:
  - platform: template
    id: hv_sw_night
    name: "Nattilstand"
    icon: mdi:weather-night
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lvgl.widget.show: hv_night_overlay
      - script.execute: homeview_show_face
    on_turn_off:
      - lvgl.widget.hide: hv_night_overlay

  - platform: template
    id: hv_sw_auto_home
    name: "Åbn Hjem ved nærhed"
    icon: mdi:home-import-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: template
    id: hv_sw_night_off
    name: "Sluk skærm om natten"
    icon: mdi:monitor-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_off:
      - light.turn_on: screen_backlight

  - platform: template
    id: hv_sw_sleep
    name: "Sluk skærm uden nærhed"
    icon: mdi:monitor-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

number:
  - platform: template
    id: hv_idle_seconds
    name: "Tilbage til urskive efter"
    icon: mdi:timer-sand
    unit_of_measurement: s
    min_value: 5
    max_value: 300
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    id: hv_sleep_minutes
    name: "Sluk skærm efter"
    icon: mdi:timer-off-outline
    unit_of_measurement: min
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    id: hv_night_on_seconds
    name: "Tændt om natten i"
    icon: mdi:timer-outline
    unit_of_measurement: s
    min_value: 10
    max_value: 600
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config

datetime:
  - platform: template
    id: hv_night_start
    type: time
    name: "Nat fra"
    icon: mdi:weather-night
    optimistic: true
    restore_value: true
    initial_value: "23:00:00"
    entity_category: config
  - platform: template
    id: hv_night_end
    type: time
    name: "Nat til"
    icon: mdi:weather-sunset-up
    optimistic: true
    restore_value: true
    initial_value: "06:30:00"
    entity_category: config

binary_sensor:
  # On between "Nat fra" and "Nat til" (also across midnight).
  # Off while the clock isn't synced yet.
  - platform: template
    id: hv_night_now
    name: "Nattetid"
    icon: mdi:weather-night
    lambda: |-
      auto now = id(hv_time).now();
      if (!now.is_valid()) return false;
      const int t = now.hour * 60 + now.minute;
      const int a = id(hv_night_start).hour * 60 + id(hv_night_start).minute;
      const int b = id(hv_night_end).hour * 60 + id(hv_night_end).minute;
      if (a == b) return false;
      return a < b ? (t >= a && t < b) : (t >= a || t < b);
    on_release:
      # Morning: screen back on with the normal daytime behaviour
      - if:
          condition:
            switch.is_on: hv_sw_night_off
          then:
            - script.execute: homeview_user_activity

select:
  - platform: template
    id: hv_night_wake
    name: "Tænd skærm om natten med"
    icon: mdi:gesture-tap
    options: ["Nærhed", "Berøring"]
    initial_option: "Nærhed"
    optimistic: true
    restore_value: true
    entity_category: config

  # Lets Home Assistant automations drive the UI ("show Home when doorbell rings")
  - platform: template
    id: hv_page_select
    name: "Side"
    icon: mdi:page-layout-body
    options: ["Urskive", "Hjem"]
    initial_option: "Urskive"
    optimistic: true
    set_action:
      - script.execute: homeview_user_activity
      - if:
          condition:
            lambda: 'return x == "Hjem";'
          then:
            - script.execute: homeview_show_home
          else:
            - script.execute: homeview_show_face

script:
  - id: homeview_user_activity
    mode: restart
    then:
      - lambda: 'id(hv_last_activity) = millis();'
      - if:
          condition:
            light.is_off: screen_backlight
          then:
            - light.turn_on: screen_backlight

  - id: homeview_proximity_changed
    mode: restart
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: hv_proximity
              # Night with touch-only wake: someone walking past must not
              # light the screen up
              - lambda: |-
                  return !(id(hv_sw_night_off).state && id(hv_night_now).state &&
                           id(hv_night_wake).current_option() == std::string("Berøring"));
          then:
            - script.execute: homeview_user_activity
            - if:
                condition:
                  and:
                    - switch.is_on: hv_sw_auto_home
                    - switch.is_off: hv_sw_night
                    - lvgl.page.is_showing: face_page
                    # at night the clock face stays (if the night screen-off is used)
                    - lambda: 'return !(id(hv_sw_night_off).state && id(hv_night_now).state);'
                then:
                  - script.execute: homeview_show_home

  # Page switches are instant: a full-screen animated transition re-renders all
  # 800x480 pixels per frame in software (~250-300 ms each on the S3), which
  # blocks the main loop and starves other components (e.g. the VL53L0X).
  # publish_state() only reports the page to HA; select.set would re-run
  # set_action and recurse into this script ("already running" warning).
  - id: homeview_show_home
    then:
      - if:
          condition:
            not:
              lvgl.page.is_showing: home_page
          then:
            - lvgl.page.show:
                id: home_page
                animation: NONE
      - lambda: 'id(hv_page_select).publish_state("Hjem");'

  - id: homeview_show_face
    then:
      - if:
          condition:
            not:
              lvgl.page.is_showing: face_page
          then:
            - lvgl.page.show:
                id: face_page
                animation: NONE
      - lambda: 'id(hv_page_select).publish_state("Urskive");'

interval:
  - interval: 1s
    then:
      - lambda: 'if (id(hv_last_activity) == 0) id(hv_last_activity) = millis();'
      # Back to the clock face when idle and nobody is close
      - if:
          condition:
            and:
              - binary_sensor.is_off: hv_proximity
              - not:
                  lvgl.page.is_showing: face_page
              - lambda: 'return (millis() - id(hv_last_activity)) > (uint32_t)(id(hv_idle_seconds).state * 1000);'
          then:
            - script.execute: homeview_show_face
      # Night: dark again "Tændt om natten i" seconds after the last touch
      # (and, in proximity mode, once nobody is close). The Face is shown
      # first so the touch that wakes the screen can't hit a button.
      - if:
          condition:
            and:
              - switch.is_on: hv_sw_night_off
              - binary_sensor.is_on: hv_night_now
              - light.is_on: screen_backlight
              - lambda: |-
                  const bool touch_only = id(hv_night_wake).current_option() == std::string("Berøring");
                  if (!touch_only && id(hv_proximity).state) return false;
                  return (millis() - id(hv_last_activity)) > (uint32_t) (id(hv_night_on_seconds).state * 1000);
          then:
            - script.execute: homeview_show_face
            - light.turn_off: screen_backlight
      # Optional: backlight off after N minutes without anyone close
      - if:
          condition:
            and:
              - switch.is_on: hv_sw_sleep
              - binary_sensor.is_off: hv_proximity
              - light.is_on: screen_backlight
              - lambda: 'return (millis() - id(hv_last_activity)) > (uint32_t)(id(hv_sleep_minutes).state * 60000);'
          then:
            - light.turn_off: screen_backlight
