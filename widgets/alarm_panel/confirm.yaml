# ---------------------------------------------------------------
#  Widget: Alarm arm confirmation (goes in lvgl: top_layer:)
#  "Tilkobl nattilstand?" / "Tilkobl alarmen?" with Annullér / Tilkobl.
#  Cancels itself after 20 s without an answer.
#  vars: uid
#  Pair with widgets/alarm_panel/data.yaml (same uid).
# ---------------------------------------------------------------
obj:
  id: ${uid}_confirm_dlg
  width: 100%
  height: 100%
  bg_color: 0x000000
  bg_opa: 70%
  hidden: true
  clickable: true
  scrollable: false
  on_click:
    - script.execute: ${uid}_confirm_no
  widgets:
    - obj:
        align: CENTER
        width: 480
        height: SIZE_CONTENT
        styles: hv_platter
        pad_all: 28
        clickable: true        # taps on the card don't cancel
        scrollable: false
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: CENTER
          pad_row: 10
        widgets:
          - label:
              id: ${uid}_cf_icon
              text: "\U000F1828"
              text_font: hv_icons_lg
              text_color: ${c_indigo}
          - label:
              id: ${uid}_cf_title
              text: "Tilkobl nattilstand?"
              text_font: hv_font_title
          - label:
              id: ${uid}_cf_sub
              width: 100%
              long_mode: WRAP
              text_align: CENTER
              text: ""
              styles: hv_secondary
          - obj:
              width: 100%
              height: 72
              pad_top: 12
              clickable: false
              scrollable: false
              layout:
                type: FLEX
                flex_flow: ROW
                pad_column: 12
              widgets:
                - button:
                    flex_grow: 1
                    height: 60
                    styles: hv_tile_off
                    pressed:
                      transform_width: -4
                      transform_height: -4
                    on_click:
                      - script.execute: ${uid}_confirm_no
                    widgets:
                      - label:
                          align: CENTER
                          text: "Annullér"
                          text_font: hv_font_title
                - button:
                    flex_grow: 1
                    height: 60
                    styles: hv_tile_off
                    bg_color: ${c_orange}
                    bg_opa: COVER
                    pressed:
                      transform_width: -4
                      transform_height: -4
                    on_click:
                      - script.execute: ${uid}_confirm_yes
                    widgets:
                      - label:
                          align: CENTER
                          text: "Tilkobl"
                          text_font: hv_font_title
                          text_color: 0x000000
