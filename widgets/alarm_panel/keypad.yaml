# ---------------------------------------------------------------
#  Widget: Alarm PIN keypad (goes in lvgl: top_layer:)
#  vars: uid
#  Pair with widgets/alarm_panel/data.yaml (same uid).
# ---------------------------------------------------------------
obj:
  id: ${uid}_keypad
  width: 100%
  height: 100%
  bg_color: ${c_bg}
  bg_opa: COVER
  hidden: true
  clickable: true
  scrollable: false
  widgets:
    # ---------- left: prompt ----------
    - obj:
        x: 0
        y: 0
        width: 380
        height: 100%
        pad_left: 40
        pad_right: 20
        pad_top: 44
        pad_bottom: 40
        clickable: false
        scrollable: false
        layout:
          type: FLEX
          flex_flow: COLUMN
          pad_row: 10
        widgets:
          - label:
              text: "\U000F099D"
              text_font: hv_icons_lg
              text_color: ${c_orange}
          - label:
              text: "Frakobl alarm"
              text_font: hv_font_large_title
          - label:
              id: ${uid}_kp_msg
              width: 100%
              long_mode: WRAP
              text: "Indtast kode"
              text_font: hv_font_body
              text_color: ${c_label_2}
          - label:
              id: ${uid}_kp_dots
              text: ""
              text_font: hv_font_large_title
              text_letter_space: 2
          - obj:
              width: 100%
              flex_grow: 1
              clickable: false
              scrollable: false
          - button:
              width: 200
              height: 60
              styles: hv_tile_off
              pressed:
                transform_width: -4
                transform_height: -4
              on_click:
                - script.execute: ${uid}_kp_hide
              widgets:
                - label:
                    align: CENTER
                    text: "Annullér"
                    text_font: hv_font_title
    # ---------- right: keys ----------
    - obj:
        id: ${uid}_kp_keys
        x: 412
        y: 46
        width: 360
        height: 392
        clickable: false
        scrollable: false
        widgets:
          - button:
              x: 0
              y: 0
              width: 112
              height: 86
              styles: hv_tile_off
              pressed:
                bg_color: 0x636366
                bg_opa: COVER
              disabled:
                bg_opa: 30%
              on_click:
                - script.execute:
                    id: ${uid}_key
                    key: "1"
              widgets:
                - label:
                    align: CENTER
                    text: "1"
                    text_font: hv_font_large_title
