# ---------------------------------------------------------------
#  Widget: Alert overlay (goes in lvgl: top_layer:)
#  vars: uid, icon, color, title, message
#  Pair with widgets/alert_overlay/data.yaml (same uid).
# ---------------------------------------------------------------
obj:
  id: ${uid}_overlay
  width: 100%
  height: 100%
  bg_color: 0x1C0606
  bg_opa: COVER
  hidden: true
  clickable: true
  scrollable: false
  layout:
    type: FLEX
    flex_flow: COLUMN
    flex_align_main: CENTER
    flex_align_cross: CENTER
    flex_align_track: CENTER
    pad_row: 14
  widgets:
    - obj:
        width: 120
        height: 120
        radius: 60
        bg_color: ${color}
        bg_opa: 25%
        clickable: false
        scrollable: false
        widgets:
          - label:
              align: CENTER
              text: "${icon}"
              text_font: hv_icons_lg
              text_color: ${color}
    - label:
        text: "${title}"
        text_font: hv_font_large_title
        text_color: ${color}
    - label:
        width: 560
        long_mode: WRAP
        text_align: CENTER
        text: "${message}"
        text_font: hv_font_body
        text_color: ${c_label_2}
    - obj:
        width: 10
        height: 16
        clickable: false
    - button:
        width: 240
        height: 64
        styles: hv_tile_off
        pressed:
          transform_width: -4
          transform_height: -4
        on_click:
          - script.execute: ${uid}_dismiss
        widgets:
          - label:
              align: CENTER
              text: "Luk"
              text_font: hv_font_title
