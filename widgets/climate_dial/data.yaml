# ---------------------------------------------------------------
#  Widget data: Climate dial with a PRESET toggle
#  vars: uid, entity, min_half, max_half,
#        preset_on, preset_off, preset_on_label, preset_off_label
#    preset_on/off = HA preset_mode values the toggle switches between
#                    (Roth: constant_temperature / default)
#  For a thermostat without presets (on/off only) use data_onoff.yaml.
# ---------------------------------------------------------------
packages:
  ${uid}_core: !include
    file: data_core.yaml
    vars: { uid: "${uid}", entity: "${entity}", min_half: "${min_half}", max_half: "${max_half}", step_half: "1" }

text_sensor:
  - platform: homeassistant
    id: ${uid}_preset_ha
    entity_id: ${entity}
    attribute: preset_mode
    internal: true
    on_value:
      - lambda: |-
          const bool on = (x == "${preset_on}");
          if (on) lv_obj_add_state(id(${uid}_preset), LV_STATE_CHECKED);
          else    lv_obj_clear_state(id(${uid}_preset), LV_STATE_CHECKED);
          lv_label_set_text(id(${uid}_preset_label), on ? "${preset_on_label}" : "${preset_off_label}");
          lv_obj_set_style_text_color(id(${uid}_preset_label),
              lv_color_hex(on ? ${c_orange} : ${c_label}), LV_PART_MAIN);

script:
  - id: ${uid}_toggle_preset
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: ${entity}
          data_template:
            preset_mode: "{{ p }}"
          variables:
            p: !lambda 'return id(${uid}_preset_ha).state == "${preset_on}" ? std::string("${preset_off}") : std::string("${preset_on}");'
