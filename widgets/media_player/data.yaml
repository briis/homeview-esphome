globals:
  # camera_proxy path of an HA camera that shows the current cover
  # (art_camera.yaml). Empty = fetch covers straight from the media proxy.
  - id: ${uid}_art_cam_pic
    type: std::string
  - id: ${uid}_art_keys
    type: std::array<std::string, 9>
  - id: ${uid}_art_loaded
    type: std::array<bool, 9>
  - id: ${uid}_art_used
    type: std::array<uint32_t, 9>
  - id: ${uid}_art_pending
    type: int
    initial_value: "-1"
  # Ignore HA volume echoes for a moment after the user moved the slider
  - id: ${uid}_vol_hold
    type: uint32_t
    initial_value: "0"

text_sensor:
  - platform: homeassistant
    id: ${uid}_state_ha
    entity_id: ${entity}
    internal: true
    on_value:
      - lambda: |-
          const bool playing = (x == "playing");
          lv_label_set_text(id(${uid}_play_icon), playing ? "\U000F03E4" : "\U000F040A");
          const char *cap = playing ? "SPILLER NU" : (x == "paused") ? "SAT PÅ PAUSE" :
                            (x == "idle" || x == "off") ? "SONOS" : "IKKE TILGÆNGELIG";
          lv_label_set_text(id(${uid}_caption), cap);
          lv_obj_set_style_text_color(id(${uid}_caption),
              lv_color_hex(playing ? ${c_red} : ${c_label_2}), LV_PART_MAIN);

  - platform: homeassistant
    id: ${uid}_title_ha
    entity_id: ${meta_entity}
    attribute: title
    internal: true
    on_value:
      - script.execute: ${uid}_render_text

  - platform: homeassistant
    id: ${uid}_artist_ha
    entity_id: ${meta_entity}
    attribute: artist
    internal: true
    on_value:
      - script.execute: ${uid}_render_text

  - platform: homeassistant
    id: ${uid}_channel_ha
    entity_id: ${meta_entity}
    attribute: channel
    internal: true
    on_value:
      - script.execute: ${uid}_render_text
      - script.execute: ${uid}_art_select

  - platform: homeassistant
    id: ${uid}_picture_ha
    entity_id: ${entity}
    attribute: entity_picture
    internal: true
    on_value:
      - script.execute: ${uid}_art_select

sensor:
  - platform: homeassistant
    id: ${uid}_volume_ha
    entity_id: ${entity}
    attribute: volume_level
    internal: true
    filters:
      - filter_out: nan
    on_value:
      - if:
          condition:
            lambda: 'return millis() - id(${uid}_vol_hold) > 3000;'
          then:
            - lvgl.slider.update:
                id: ${uid}_volume
                value: !lambda 'return x * 100.0f;'

script:
  # Pick (or fetch) the artwork for what is playing. Waits briefly because HA
  # sends entity_picture and media_channel as separate updates.
  - id: ${uid}_art_select
    mode: restart
    then:
      - delay: 300ms
      - lambda: |-
          online_image::OnlineImage *slots[] = { id(${uid}_art_img), id(${uid}_art_c1), id(${uid}_art_c2), id(${uid}_art_c3), id(${uid}_art_c4), id(${uid}_art_c5), id(${uid}_art_c6), id(${uid}_art_c7), id(${uid}_art_c8) };
          const int n = sizeof(slots) / sizeof(slots[0]);
          auto &keys = id(${uid}_art_keys);
          auto &loaded = id(${uid}_art_loaded);
          auto &used = id(${uid}_art_used);
          std::string pic = id(${uid}_picture_ha).state;
          std::string ch = id(${uid}_channel_ha).state;
          if (ch == "None" || ch == "unknown") ch.clear();
          if (pic.empty() || pic == "None") {
            id(${uid}_art_pending) = -1;
            lv_obj_add_flag(id(${uid}_art), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(${uid}_art_placeholder), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          // 1) Built-in logo (compiled into the firmware)?
          if (!ch.empty()) {
            std::vector<std::pair<std::string, image::Image *>> table = { ${logo_table} };
            for (auto &e : table) {
              if (ch.rfind(e.first, 0) == 0 || e.first.rfind(ch, 0) == 0) {
                id(${uid}_art_pending) = -1;      // ignore any download still running
                lv_image_set_src(id(${uid}_art), e.second->get_lv_image_dsc());
                lv_obj_clear_flag(id(${uid}_art), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(${uid}_art_placeholder), LV_OBJ_FLAG_HIDDEN);
                return;
              }
            }
          }
          // 2) Download cache
          std::string url = pic.rfind("http", 0) == 0 ? pic : std::string("${ha_url}") + pic;
          // Music covers via the HA cover camera (if configured): HA scales the
          // image and re-encodes it as a plain JPEG the decoder can always read.
          // (Covers from Sonos/Spotify can be "extended" JPEGs -> JPEGDEC error 3.)
          if (ch.empty() && !id(${uid}_art_cam_pic).empty()) {
            const std::string &cam = id(${uid}_art_cam_pic);
            url = cam.rfind("http", 0) == 0 ? cam : std::string("${ha_url}") + cam;
            url += (url.find('?') == std::string::npos) ? "?" : "&";
            url += "width=132&height=132&t=" + to_string(millis());
          }
          int slot = 0;                        // music: always fetch into slot 0
          if (!ch.empty()) {
            for (int i = 1; i < n; i++) {     // cache hit -> instant
              if (keys[i] == ch && loaded[i]) {
                used[i] = millis();
                id(${uid}_art_pending) = i;
                id(${uid}_art_show)->execute(i);
                return;
              }
            }
            slot = 1;                          // miss -> same key, empty or LRU slot
            for (int i = 1; i < n; i++) {
              if (keys[i] == ch || keys[i].empty()) { slot = i; break; }
              if (used[i] < used[slot]) slot = i;
            }
            keys[slot] = ch;
            used[slot] = millis();
          }
          loaded[slot] = false;
          id(${uid}_art_pending) = slot;
          slots[slot]->set_url(url);
          slots[slot]->update();

  - id: ${uid}_art_show
    parameters:
      slot: int
    then:
      - lambda: |-
          online_image::OnlineImage *slots[] = { id(${uid}_art_img), id(${uid}_art_c1), id(${uid}_art_c2), id(${uid}_art_c3), id(${uid}_art_c4), id(${uid}_art_c5), id(${uid}_art_c6), id(${uid}_art_c7), id(${uid}_art_c8) };
          if (slot < 0 || slot >= (int) (sizeof(slots) / sizeof(slots[0]))) return;
          lv_image_set_src(id(${uid}_art), slots[slot]->get_lv_image_dsc());
          lv_obj_clear_flag(id(${uid}_art), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(${uid}_art_placeholder), LV_OBJ_FLAG_HIDDEN);

  - id: ${uid}_render_text
    then:
      - lambda: |-
          // Radio: title is often the station or the current programme;
          // channel is the station. Show the best combination available.
          std::string title = id(${uid}_title_ha).state;
          std::string artist = id(${uid}_artist_ha).state;
          std::string channel = id(${uid}_channel_ha).state;
          auto bad = [](const std::string &s) { return s.empty() || s == "None" || s == "unknown"; };
          if (bad(title)) title = bad(channel) ? std::string("Intet afspilles") : channel;
          if (bad(artist)) artist = (!bad(channel) && channel != title) ? channel : std::string("");
          lv_label_set_text(id(${uid}_title), title.c_str());
          lv_label_set_text(id(${uid}_artist), artist.c_str());

  - id: ${uid}_play_pause
    then:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: ${entity}

  # Radio streams can't skip: HA script steps through the Sonos favourites
  # (source_list) instead, and skips tracks for normal music.
  - id: ${uid}_prev_track
    then:
      - homeassistant.action:
          action: script.homeview_media_skip
          data:
            player: ${entity}
            direction: "prev"

  # Radio streams can't skip: HA script steps through the Sonos favourites
  # (source_list) instead, and skips tracks for normal music.
  - id: ${uid}_next_track
    then:
      - homeassistant.action:
          action: script.homeview_media_skip
          data:
            player: ${entity}
            direction: "next"

  - id: ${uid}_set_volume
    parameters:
      level: float
    then:
      - lambda: 'id(${uid}_vol_hold) = millis();'
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: ${entity}
          data_template:
            volume_level: "{{ level }}"
          variables:
            level: !lambda 'return str_sprintf("%.2f", level / 100.0f);'
