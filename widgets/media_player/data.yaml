# ---------------------------------------------------------------
#  Widget data: Now Playing
#  vars: uid, entity, meta_entity, ha_url, logo_table
#    meta_entity = HA template sensor that mirrors the player with
#      attributes title / artist / channel that are ALWAYS present
#      ("" when the player has none). Needed because HA does not tell
#      ESPHome when an attribute disappears: without it the artist of the
#      last Spotify track stays on screen when a radio stream starts.
#      Template (see homeassistant/homeview_badevaerelse.yaml):
#        state: "{{ states('media_player.x') }}"
#        attributes:
#          title:   "{{ state_attr('media_player.x', 'media_title') or '' }}"
#          artist:  "{{ state_attr('media_player.x', 'media_artist') or '' }}"
#          channel: "{{ state_attr('media_player.x', 'media_channel') or '' }}"
#    logo_table = optional built-in logos as C++ pairs, e.g.
#      '{"DR P1", id(logo_p1)}, {"DR P2", id(logo_p2)}'
#      (use "" for none). Matching stations show these instantly;
#      everything else goes through the download cache below.
#  Needs script.homeview_media_skip from homeassistant/homeview.yaml
#    ha_url = how the DEVICE reaches Home Assistant, e.g.
#             http://192.168.1.10:8123  (no trailing slash)
#  Artwork comes from the media player's entity_picture through the HA
#  media proxy (Sonos gives station logos for radio, covers for music).
# ---------------------------------------------------------------
http_request:
  verify_ssl: false
  # ESPHome downloads synchronously: a long timeout freezes the UI while
  # HA is unreachable. Artwork on the LAN arrives well within 3 s.
  timeout: 3s

# Artwork cache: slot 0 = current music cover (always downloaded),
# slots 1..8 = radio station logos, kept in PSRAM and keyed by station
# name (least recently used is replaced). Re-selecting a station shows
# its logo instantly; only the first play after a reboot downloads it.
image:
  - platform: online_image
    id: ${uid}_art_img
    url: ${ha_url}/
    format: AUTO
    type: RGB565
    resize: 132x132
    buffer_size: 32768
    on_download_finished:
      - lambda: 'id(${uid}_art_loaded)[0] = true;'
      - if:
          condition:
            lambda: 'return id(${uid}_art_pending) == 0;'
          then:
            - script.execute:
                id: ${uid}_art_show
                slot: 0
    on_error:
      - lambda: 'id(${uid}_art_loaded)[0] = false; id(${uid}_art_keys)[0].clear();'
      - if:
          condition:
            lambda: 'return id(${uid}_art_pending) == 0;'
          then:
            - lvgl.widget.hide: ${uid}_art
            - lvgl.widget.show: ${uid}_art_placeholder
  - platform: online_image
    id: ${uid}_art_c1
    url: ${ha_url}/
    format: AUTO
    type: RGB565
    resize: 132x132
    buffer_size: 32768
    on_download_finished:
      - lambda: 'id(${uid}_art_loaded)[1] = true;'
      - if:
          condition:
            lambda: 'return id(${uid}_art_pending) == 1;'
          then:
            - script.execute:
                id: ${uid}_art_show
                slot: 1
    on_error:
      - lambda: 'id(${uid}_art_loaded)[1] = false; id(${uid}_art_keys)[1].clear();'
      - if:
          condition:
            lambda: 'return id(${uid}_art_pending) == 1;'
          then:
