# ---------------------------------------------------------------
#  Widget: Page header — large title left, date + time right
#  (Home app style). Tap the time to return to the clock face.
#  vars: uid, title, margin
#  Pair with widgets/page_header/data.yaml (same uid).
# ---------------------------------------------------------------
obj:
  id: ${uid}
  x: 0
  y: 0
  width: 100%
  height: 70
  pad_left: ${margin}
  pad_right: ${margin}
  scrollable: false
  clickable: false
  widgets:
    - label:
        id: ${uid}_title
        align: LEFT_MID
        y: 4
        text: "${title}"
        text_font: hv_font_large_title
    - obj:
        align: RIGHT_MID
        y: 4
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        scrollable: false
        on_click:
          - script.execute: homeview_show_face
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: END
          pad_row: 0
        widgets:
          - label:
              id: ${uid}_date
              text: ""
              styles: hv_caption
              text_color: ${c_orange}
          - label:
              id: ${uid}_time
              text: ""
              text_font: hv_font_large_title
